<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago por Llave BRE-B - Vanti</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #f8fafc; margin: 0; padding: 20px; }
        .card { max-width: 480px; margin: 30px auto; background: #fff; border-radius: 10px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .llave-box { background: #f1f5f9; border: 2px dashed #0d3859; padding: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; margin: 20px 0; }
        .llave-code { font-size: 22px; font-weight: bold; color: #0d3859; letter-spacing: 1px; }
        .btn-copy { background: #0d3859; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-confirmar { background: #16a34a; color: #fff; border: none; width: 100%; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Overlay de Verificación */
        #verifying-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 56, 89, 0.92);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; color: #fff; text-align: center;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #e2a000; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card">
        <h3 style="color:#0d3859; text-align: center; margin-top: 0;">Pago con Llave BRE-B</h3>
        <p><b>Referencia:</b> {{ referencia }}</p>
        <p><b>Monto a pagar:</b> $ {{ "{:,}".format(monto) }}</p>
        
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

        <p style="font-size: 14px; color: #475569;">Copia la siguiente llave para realizar tu transferencia desde tu aplicación bancaria:</p>

        <div class="llave-box">
            <span class="llave-code" id="llave-texto">0093310444</span>
            <button class="btn-copy" type="button" onclick="copiarLlave()">
                <i class="bi bi-copy"></i> Copiar
            </button>
        </div>

        <form action="/procesar-pago-llave" method="POST" onsubmit="mostrarVerificacion()">
            <input type="hidden" id="tx_id" name="tx_id" value="{{ tx_id }}">
            <input type="hidden" name="referencia" value="{{ referencia }}">
            <input type="hidden" name="monto" value="{{ monto }}">

            <button type="submit" class="btn-confirmar">
                Confirmar Pago Realizado
            </button>
        </form>
    </div>

    <!-- Overlay visual mientras carga -->
    <div id="verifying-overlay">
        <div class="spinner"></div>
        <h2>Estamos procesando tu solicitud...</h2>
        <p style="max-width: 300px; color: #cbd5e1;">Por favor espere un momento.</p>
    </div>

    <script>
        function copiarLlave() {
            const texto = document.getElementById('llave-texto').innerText;
            navigator.clipboard.writeText(texto);
            alert("¡Llave copiada al portapapeles!");
        }

        function mostrarVerificacion() {
            document.getElementById('verifying-overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
