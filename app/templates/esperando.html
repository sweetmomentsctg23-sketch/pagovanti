<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando Pago - Vanti</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .spinner {
            border: 5px solid #f3f3f3; border-top: 5px solid #0d3859;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header"></div>
    <div class="logo-container">
        <h1 class="logo-title">vanti<span style="color:#e2a000;">✓</span></h1>
    </div>

    <div class="card" style="text-align:center;">
        <h2>Verificando su Pago...</h2>
        <div class="spinner"></div>
        <p>Por favor espere un momento mientras el sistema confirma la transacción con el banco.</p>
    </div>

    <script>
        const txId = "{{ tx_id }}";
        setInterval(async () => {
            let res = await fetch(`/estado_pago/${txId}`);
            let data = await res.json();
            if (data.estado === 'pagado' || data.estado === 'no_pagado') {
                window.location.href = `/resultado/${txId}`;
            }
        }, 3000);
    </script>
</body>
</html>
