<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela de Pago - Vanti</title>
    <link rel="stylesheet" href="/static/css/style.css">
<script type="text/javascript" src="https://checkout.epayco.co/checkout.js"></script>
</head>
<body>
    <div class="header"></div>
    <div class="logo-container">
        <h1 class="logo-title">vanti<span style="color:#e2a000;">✓</span></h1>
    </div>

    <div class="card" style="max-width: 520px; margin: 20px auto; text-align: left; padding: 25px;">
        <h3 style="color:#0d3859; text-align: center; margin-top: 0;">Resumen de Pago</h3>
        <p><b>Referencia:</b> {{ referencia }}</p>
        <p><b>Total a pagar:</b> $ {{ "{:,}".format(monto) }}</p>

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

        <button id="btn-pagar" onclick="pagarConEpayco()" style="background: #16a34a; color: #fff; border: none; width: 100%; padding: 14px; border-radius: 6px; font-size: 17px; font-weight: 500; cursor: pointer;">
           Ir a pagar
        </button>
        <p style="text-align: center; font-size: 13px; color: #64748b; margin: 12px 0 0;">
            Serás dirigido a la pasarela segura de Epayco para completar tu pago PSE.
        </p>
    </div>

<script>
    const txId = "{{ tx_id }}";
    const registrarActividad = () => navigator.sendBeacon(`/actividad/${txId}`);
    registrarActividad();
    setInterval(registrarActividad, 5000);

    // Configuración del handler de ePayco con tu PUBLIC KEY
    const handler = ePayco.checkout.configure({
        key: '{{ epayco_public_key }}',
        test: {{ epayco_test }}
    });

    function pagarConEpayco() {
        if (typeof ePayco === "undefined") {
            alert("No se pudo cargar la pasarela de pagos. Revisa tu conexión e inténtalo de nuevo.");
            return;
        }

        const data = {
            // Datos del pago
            name: "Pago Factura Vanti",
            description: "Factura Ref: {{ referencia }}",
            invoice: "{{ ref_epayco }}",
            currency: "cop",
            amount: "{{ monto }}", // ePayco recibe el valor normal en COP (ej. 100000), no en centavos
            tax_base: "0",
            tax: "0",
            country: "co",
            lang: "es",

            // Configuración visual
            external: "false", // 'false' abre el modal emergente dentro de tu web

            // Redirección al finalizar
            response: window.location.origin + "/resultado/{{ tx_id }}",
            confirmation: window.location.origin + "/notificar_pago"
        };

        // Abre la pasarela de pago
        handler.open(data);
    }
</script>
</body>
</html>
